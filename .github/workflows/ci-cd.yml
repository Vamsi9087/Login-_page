name: CI/CD — Build & Deploy to VM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: my-nextjs-app
  NODE_VERSION: '22.x'

jobs:
  # ── Job 1: Lint & Type Check ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Job 2: Build Docker image on VM ───────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: self-hosted
    needs: lint
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.run_number }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.run_number }} ${{ env.IMAGE_NAME }}:latest

  # ── Job 3: Deploy on the VM ───────────────────────────────────────────────
  deploy:
    name: Deploy on VM
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Stop old container
        run: |
          docker stop nextjs-app || true
          docker rm   nextjs-app || true

      - name: Run new container
        run: |
          docker run -d \
            --name nextjs-app \
            --restart unless-stopped \
            -p 3000:3000 \
            -e NODE_ENV=production \
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Clean up old images
        run: docker image prune -f

      - name: Print app URL
        run: echo "✅ App running at http://$(hostname -I | awk '{print $1}'):3000"

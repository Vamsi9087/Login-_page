name: CI/CD — Build & Deploy to VM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_LOGIN_SERVER: myappregistry9087.azurecr.io
  IMAGE_NAME: my-nextjs-app
  RESOURCE_GROUP: myapp-rg
  NODE_VERSION: '22.x'

jobs:
  # ── Job 1: Lint & Type Check ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: self-hosted          # ← runs on your Azure Linux VM agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Job 2: Build & Push Docker image to ACR ───────────────────────────────
  build:
    name: Build & Push to ACR
    runs-on: self-hosted          # ← runs on your Azure Linux VM agent
    needs: lint
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy directly on the VM ─────────────────────────────────────
  deploy:
    name: Deploy on Azure VM
    runs-on: self-hosted          # ← runs on your Azure Linux VM agent
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Pull latest image
        run: |
          docker pull ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Stop & remove old container
        run: |
          docker stop nextjs-app || true
          docker rm   nextjs-app || true

      - name: Run new container
        run: |
          docker run -d \
            --name nextjs-app \
            --restart unless-stopped \
            -p 3000:3000 \
            -e NODE_ENV=production \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Clean up old images
        run: docker image prune -f

      - name: Print app URL
        run: |
          echo "✅ App deployed at http://$(hostname -I | awk '{print $1}'):3000"

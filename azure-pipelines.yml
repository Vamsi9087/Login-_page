trigger:
  branches:
    include:
      - main

variables:
  imageRepository: 'my-nextjs-app'
  tag: '$(Build.BuildId)'
  NODE_VERSION: '22.x'
  AGENT_POOL: 'my-linux-vm-pool'

stages:

# ── Stage 1: Lint & Type Check ─────────────────────────────────────────────
- stage: Lint
  displayName: 'Lint & Type Check'
  jobs:
  - job: LintCheck
    pool:
      name: $(AGENT_POOL)
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js $(NODE_VERSION)'
      inputs:
        versionSpec: $(NODE_VERSION)

    - script: npm ci --frozen-lockfile
      displayName: 'Install dependencies'

    - script: npm run lint
      displayName: 'Run ESLint'

    - script: npx tsc --noEmit
      displayName: 'TypeScript type check'

# ── Stage 2: Build Docker image on VM ──────────────────────────────────────
- stage: Build
  displayName: 'Build Docker Image'
  dependsOn: Lint
  jobs:
  - job: BuildImage
    pool:
      name: $(AGENT_POOL)
    steps:
    - script: |
        docker build -t $(imageRepository):$(tag) .
        docker tag $(imageRepository):$(tag) $(imageRepository):latest
      displayName: 'Build Docker Image'

# ── Stage 3: Deploy on the VM ──────────────────────────────────────────────
- stage: Deploy
  displayName: 'Deploy on VM'
  dependsOn: Build
  jobs:
  - deployment: DeployOnVM
    pool:
      name: $(AGENT_POOL)
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "Stopping old container..."
              docker stop nextjs-app || true
              docker rm   nextjs-app || true

              echo "Starting new container..."
              docker run -d \
                --name nextjs-app \
                --restart unless-stopped \
                -p 3000:3000 \
                -e NODE_ENV=production \
                $(imageRepository):$(tag)

              echo "Cleaning up old images..."
              docker image prune -f

              echo "✅ App running at http://$(hostname -I | awk '{print $1}'):3000"
            displayName: 'Run Docker container'

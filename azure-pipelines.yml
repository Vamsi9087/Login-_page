trigger:
  branches:
    include:
      - main

variables:
  acrName: 'myappregistry9087'
  acrLoginServer: 'myappregistry9087.azurecr.io'
  imageRepository: 'my-nextjs-app'
  containerAppName: 'my-nextjs-app'
  resourceGroup: 'myapp-rg'
  tag: '$(Build.BuildId)'

stages:

- stage: Build
  displayName: 'Build and Push to ACR'
  jobs:
  - job: BuildPush
    pool:
      name: Default
    steps:

    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: Dockerfile
        containerRegistry: 'acr-service-connection'
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: 'Deploy to Container App'
  dependsOn: Build
  jobs:
  - deployment: DeployApp
    pool:
      name: Default
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Update Container App'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az extension add --name containerapp --upgrade -y
                az containerapp update \
                  --name $(containerAppName) \
                  --resource-group $(resourceGroup) \
                  --image $(acrLoginServer)/$(imageRepository):$(tag)
                echo "Deployed! URL:"
                az containerapp show \
                  --name $(containerAppName) \
                  --resource-group $(resourceGroup) \
                  --query properties.configuration.ingress.fqdn \
                  --output tsv